# AIGC 视频工作流 · 服务编排
services:
  video-workflow:
    build: .
    environment:
      # key 从宿主机的环境变量读取（.env 或 shell 里 export）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # 容器里访问宿主机的 ComfyUI（宿主机 GPU）
      - COMFY_URL=http://host.docker.internal:8188
    # 运行示例（传入商品名）：
    #   docker compose run --rm video-workflow "一款保温杯"
